<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrimPass – Anmelden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0f;
    --bg-elev: #131318;
    --border-strong: rgba(255,255,255,0.14);
    --gold: #f0b429;
    --text: #f3f2ef;
    --text-dim: #9a98a3;
    --text-faint: #64626d;
    --loss: #e2596b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  a{color:inherit; text-decoration:none;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #1a1710 0%, var(--bg) 55%);
    color:var(--text); font-family:'Manrope', sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }
  .card{
    width:100%; max-width:380px; background:var(--bg-elev); border:1px solid var(--border-strong);
    border-radius:20px; padding:36px 32px; text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.45);
  }
  .brand{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(145deg, var(--gold), #b9821f);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:15px; color:#161616;
  }
  .brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:19px; letter-spacing:0.2px;}
  h1{font-family:'Space Grotesk'; font-size:22px; margin-bottom:10px;}
  p{color:var(--text-dim); font-size:14px; margin-bottom:28px; line-height:1.55;}
  .discord-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:#5865F2; color:#fff; border:none; border-radius:12px;
    padding:14px 0; font-weight:700; font-size:15px; font-family:inherit;
    transition:background .15s ease;
  }
  .discord-btn:hover{background:#4954d6;}
  .discord-btn svg{width:20px; height:20px; fill:#fff; flex-shrink:0;}
  .error-box{
    margin-top:18px; padding:12px 14px; border-radius:10px;
    background:rgba(226,89,107,0.14); border:1px solid rgba(226,89,107,0.3);
    color:var(--loss); font-size:13px; display:none; text-align:left;
  }
  .error-box.show{display:block;}
  .fineprint{margin-top:24px; font-size:11.5px; color:var(--text-faint); line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">SP</div>
      <div class="brand-name">ScrimPass</div>
    </div>
    <h1>Willkommen zurück</h1>
    <p>Melde dich mit Discord an, um Scrims zu spielen, Teams zu bilden und deinen Fortschritt zu speichern.</p>
    <a class="discord-btn" href="/auth/discord/login">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
      Mit Discord anmelden
    </a>
    <div class="error-box" id="error-box">Anmeldung fehlgeschlagen. Bitte versuche es erneut.</div>
    <div class="fineprint">Mit der Anmeldung erklärst du dich mit den Nutzungsbedingungen einverstanden.</div>
  </div>
  <script>
    if(new URLSearchParams(window.location.search).get('error')){
      document.getElementById('error-box').classList.add('show');
    }
  </script>
</body>
</html>
